name: Build Wood Sheet Layout for Rhino 7 and 8

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - woodsheetlayout-2.2.6-trim-mapping
    paths:
      - "WoodSheetLayout/**"
      - ".github/workflows/build-wood-sheet-layout.yml"
  pull_request:
    branches:
      - main
    paths:
      - "WoodSheetLayout/**"
      - ".github/workflows/build-wood-sheet-layout.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify layout logic
        shell: pwsh
        working-directory: WoodSheetLayout
        run: python tests/verify_layout.py

      - name: Build Wood Sheet Layout
        shell: pwsh
        working-directory: WoodSheetLayout
        run: ./build.ps1 -Configuration Release

      - name: Upload Rhino 7 plug-in
        uses: actions/upload-artifact@v4
        with:
          name: WoodSheetLayout-2.2.6-rhino7
          path: WoodSheetLayout/dist/WoodSheetLayout-2.2.6-rhino7.zip
          if-no-files-found: error

      - name: Upload Rhino 8 plug-in
        uses: actions/upload-artifact@v4
        with:
          name: WoodSheetLayout-2.2.6-rhino8
          path: WoodSheetLayout/dist/WoodSheetLayout-2.2.6-rhino8.zip
          if-no-files-found: error

      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: WoodSheetLayout-2.2.6-rhino7-rhino8
          path: WoodSheetLayout/dist/WoodSheetLayout-2.2.6-rhino7-rhino8.zip
          if-no-files-found: error

      - name: Publish permanent combined installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'Publish WoodSheetLayout 2.2.6 installer')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path WoodSheetLayout/releases -Force | Out-Null
          Copy-Item -LiteralPath WoodSheetLayout/dist/WoodSheetLayout-2.2.6-rhino7-rhino8.zip -Destination WoodSheetLayout/releases/WoodSheetLayout-2.2.6-rhino7-rhino8.zip -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WoodSheetLayout/releases/WoodSheetLayout-2.2.6-rhino7-rhino8.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish WoodSheetLayout 2.2.6 installer"
            git push
          }
