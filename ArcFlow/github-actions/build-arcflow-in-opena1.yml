name: Build ArcFlow for Rhino 7 and 8

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arcflow-1.2.1-rhino7-compat
    paths:
      - "ArcFlow/**"
      - ".github/workflows/build-arcflow.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ArcFlow/**"
      - ".github/workflows/build-arcflow.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify G1 and control-point collinearity
        shell: pwsh
        working-directory: ArcFlow
        run: |
          python -m pip install --disable-pip-version-check rhino3dm==8.32.0
          python tests/verify_geometry.py

      - name: Build ArcFlow
        shell: pwsh
        working-directory: ArcFlow
        run: ./build.ps1 -Configuration Release

      - name: Upload Rhino 7 plug-in
        uses: actions/upload-artifact@v4
        with:
          name: ArcFlow-1.2.1-rhino7
          path: ArcFlow/dist/ArcFlow-1.2.1-rhino7.zip
          if-no-files-found: error

      - name: Upload Rhino 8 plug-in
        uses: actions/upload-artifact@v4
        with:
          name: ArcFlow-1.2.1-rhino8
          path: ArcFlow/dist/ArcFlow-1.2.1-rhino8.zip
          if-no-files-found: error

      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: ArcFlow-1.2.1-rhino7-rhino8
          path: ArcFlow/dist/ArcFlow-1.2.1-rhino7-rhino8.zip
          if-no-files-found: error

      - name: Publish permanent combined installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'Publish ArcFlow 1.2.1 installer')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ArcFlow/releases -Force | Out-Null
          Copy-Item -LiteralPath ArcFlow/dist/ArcFlow-1.2.1-rhino7-rhino8.zip -Destination ArcFlow/releases/ArcFlow-1.2.1-rhino7-rhino8.zip -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ArcFlow/releases/ArcFlow-1.2.1-rhino7-rhino8.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish ArcFlow 1.2.1 installer"
            git push
          }
