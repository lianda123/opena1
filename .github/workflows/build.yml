name: Build ProductMotion Timeline for Rhino 7 and 8

on:
  workflow_dispatch:
  pull_request:
    branches:
      - product-motion-0.4.7-interaction-gear
    paths:
      - "新建文件夹/**"
      - ".github/workflows/build.yml"
  push:
    branches:
      - main
      - product-motion-0.4.6-keyframe-editing
      - product-motion-0.4.7-interaction-gear
    paths:
      - "新建文件夹/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify hierarchy and transmission logic
        shell: pwsh
        working-directory: 新建文件夹
        run: python tests/verify_v020.py

      - name: Build ProductMotion Timeline
        shell: pwsh
        working-directory: 新建文件夹
        run: ./build.ps1 -Configuration Release

      - name: Upload Rhino 7 plug-in
        uses: actions/upload-artifact@v4
        with:
          name: ProductMotionTimeline-0.4.7-rhino7
          path: 新建文件夹/dist/ProductMotionTimeline-0.4.7-rhino7.zip
          if-no-files-found: error

      - name: Upload Rhino 8 plug-in
        uses: actions/upload-artifact@v4
        with:
          name: ProductMotionTimeline-0.4.7-rhino8
          path: 新建文件夹/dist/ProductMotionTimeline-0.4.7-rhino8.zip
          if-no-files-found: error

      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: ProductMotionTimeline-0.4.7-rhino7-rhino8
          path: 新建文件夹/dist/ProductMotionTimeline-0.4.7-rhino7-rhino8.zip
          if-no-files-found: error

      - name: Publish permanent combined installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path downloads -Force | Out-Null
          Copy-Item -LiteralPath 新建文件夹/dist/ProductMotionTimeline-0.4.7-rhino7-rhino8.zip -Destination downloads/ProductMotionTimeline-0.4.7-rhino7-rhino8.zip -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/ProductMotionTimeline-0.4.7-rhino7-rhino8.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish ProductMotion Timeline 0.4.7 installer"
            git push
          }
