name: Build MechanismMaker for Rhino 7 and 8

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "MechanismMaker/**"
      - ".github/workflows/build-mechanism-maker.yml"
  push:
    branches:
      - main
    paths:
      - "MechanismMaker/**"
      - ".github/workflows/build-mechanism-maker.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify mechanism rules
        shell: pwsh
        working-directory: MechanismMaker
        run: python tests/verify_mechanism.py

      - name: Build MechanismMaker
        shell: pwsh
        working-directory: MechanismMaker
        run: ./build.ps1 -Configuration Release

      - name: Upload Rhino 7 plug-in
        uses: actions/upload-artifact@v4
        with:
          name: MechanismMaker-1.0.0-rhino7
          path: MechanismMaker/dist/MechanismMaker-1.0.0-rhino7.zip
          if-no-files-found: error

      - name: Upload Rhino 8 plug-in
        uses: actions/upload-artifact@v4
        with:
          name: MechanismMaker-1.0.0-rhino8
          path: MechanismMaker/dist/MechanismMaker-1.0.0-rhino8.zip
          if-no-files-found: error

      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: MechanismMaker-1.0.0-rhino7-rhino8
          path: MechanismMaker/dist/MechanismMaker-1.0.0-rhino7-rhino8.zip
          if-no-files-found: error
