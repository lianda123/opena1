name: Build WoodJoint Pro for Rhino 7 and 8

on:
  workflow_dispatch:
  push:
    branches:
      - woodjoint-pro-1.0.0
    paths:
      - "WoodJointPro/**"
      - ".github/workflows/build-wood-joint-pro.yml"
  pull_request:
    branches:
      - main
    paths:
      - "WoodJointPro/**"
      - ".github/workflows/build-wood-joint-pro.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify WoodJoint Pro logic
        shell: pwsh
        working-directory: WoodJointPro
        run: python tests/verify_wood_joint_pro.py
      - name: Build WoodJoint Pro
        shell: pwsh
        working-directory: WoodJointPro
        run: ./build.ps1 -Configuration Release
      - name: Upload Rhino 7 plug-in
        uses: actions/upload-artifact@v4
        with:
          name: WoodJointPro-1.0.0-rhino7
          path: WoodJointPro/dist/WoodJointPro-1.0.0-rhino7.zip
          if-no-files-found: error
      - name: Upload Rhino 8 plug-in
        uses: actions/upload-artifact@v4
        with:
          name: WoodJointPro-1.0.0-rhino8
          path: WoodJointPro/dist/WoodJointPro-1.0.0-rhino8.zip
          if-no-files-found: error
      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: WoodJointPro-1.0.0-rhino7-rhino8
          path: WoodJointPro/dist/WoodJointPro-1.0.0-rhino7-rhino8.zip
          if-no-files-found: error
