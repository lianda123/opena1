name: Build Wood Sheet Layout for Rhino 7 and 8

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - woodsheetlayout-2.0
    paths:
      - "WoodSheetLayout/**"
      - ".github/workflows/build-wood-sheet-layout.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify layout logic
        shell: pwsh
        working-directory: WoodSheetLayout
        run: python tests/verify_layout.py

      - name: Build Wood Sheet Layout
        shell: pwsh
        working-directory: WoodSheetLayout
        run: ./build.ps1 -Configuration Release

      - name: Upload Rhino 7 plug-in
        uses: actions/upload-artifact@v4
        with:
          name: WoodSheetLayout-2.0.0-rhino7
          path: WoodSheetLayout/dist/WoodSheetLayout-2.0.0-rhino7.zip
          if-no-files-found: error

      - name: Upload Rhino 8 plug-in
        uses: actions/upload-artifact@v4
        with:
          name: WoodSheetLayout-2.0.0-rhino8
          path: WoodSheetLayout/dist/WoodSheetLayout-2.0.0-rhino8.zip
          if-no-files-found: error

      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: WoodSheetLayout-2.0.0-rhino7-rhino8
          path: WoodSheetLayout/dist/WoodSheetLayout-2.0.0-rhino7-rhino8.zip
          if-no-files-found: error
