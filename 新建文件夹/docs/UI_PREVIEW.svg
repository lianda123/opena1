<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
  <defs>
    <linearGradient id="top" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#303238"/>
      <stop offset="1" stop-color="#25272c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".36"/>
    </filter>
    <style>
      .ui{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#e8eaee}
      .small{font-size:14px}.mid{font-size:16px}.title{font-size:20px;font-weight:600}
      .button{fill:#464950;stroke:#5c6068;stroke-width:1}.buttonAccent{fill:#d69228;stroke:#f0ae43;stroke-width:1}
      .muted{fill:#9ca1aa}.grid{stroke:#41444b;stroke-width:1}.minor{stroke:#33363c;stroke-width:1}
    </style>
  </defs>
  <rect width="1280" height="600" fill="#16171a"/>
  <rect x="36" y="32" width="1208" height="536" rx="10" fill="#25272c" stroke="#4a4d55" filter="url(#shadow)"/>
  <rect x="36" y="32" width="1208" height="50" rx="10" fill="url(#top)"/>
  <rect x="36" y="70" width="1208" height="12" fill="#25272c"/>
  <circle cx="62" cy="57" r="5" fill="#ffb13a"/>
