      <line class="minor" x1="548" y1="30" x2="548" y2="288"/><line class="minor" x1="601" y1="30" x2="601" y2="288"/>
      <line class="minor" x1="708" y1="30" x2="708" y2="288"/><line class="minor" x1="761" y1="30" x2="761" y2="288"/>
      <line class="minor" x1="868" y1="30" x2="868" y2="288"/><line class="minor" x1="921" y1="30" x2="921" y2="288"/>
      <line class="minor" x1="1028" y1="30" x2="1028" y2="288"/><line class="minor" x1="1081" y1="30" x2="1081" y2="288"/>
    </g>
    <g>
      <rect x="0" y="36" width="1170" height="55" fill="#343a44"/><rect x="0" y="92" width="1170" height="55" fill="#25272c"/>
      <rect x="0" y="148" width="1170" height="55" fill="#292b30"/><rect x="0" y="204" width="1170" height="55" fill="#25272c"/>
      <text x="15" y="70" class="ui mid">拨盘旋转</text><text x="15" y="126" class="ui mid">棘爪回弹</text>
      <text x="15" y="182" class="ui mid">柜门开合</text><text x="15" y="238" class="ui mid">双铃摆动</text>
    </g>
    <g fill="#ffb13a">
