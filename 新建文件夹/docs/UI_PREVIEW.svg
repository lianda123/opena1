  <g transform="translate(55 451)">
    <text x="0" y="23" class="ui small">轨道名</text><rect x="58" y="0" width="150" height="30" rx="4" class="button"/><text x="70" y="21" class="ui small">拨盘旋转</text>
    <g><rect x="216" width="62" height="30" rx="4" class="button"/><text x="232" y="21" class="ui small">改名</text></g>
    <g><rect x="286" width="70" height="30" rx="4" class="button"/><text x="300" y="21" class="ui small">设轴心</text></g>
    <g><rect x="364" width="70" height="30" rx="4" class="button"/><text x="378" y="21" class="ui small">重绑定</text></g>
