  <text x="1170" y="63" class="ui small muted">Rhino 7 / 8</text>

  <g transform="translate(55 96)">
    <g><rect class="button" x="0" y="0" width="42" height="31" rx="4"/><text class="ui mid" x="11" y="22">|◀</text></g>
    <g><rect class="button" x="48" y="0" width="42" height="31" rx="4"/><text class="ui mid" x="62" y="22">◀</text></g>
    <g><rect class="buttonAccent" x="96" y="0" width="78" height="31" rx="4"/><text class="ui mid" x="113" y="22">Ⅱ 暂停</text></g>
    <g><rect class="button" x="180" y="0" width="42" height="31" rx="4"/><text class="ui mid" x="194" y="22">■</text></g>
    <g><rect class="button" x="228" y="0" width="42" height="31" rx="4"/><text class="ui mid" x="242" y="22">▶</text></g>
    <g><rect class="button" x="276" y="0" width="42" height="31" rx="4"/><text class="ui mid" x="286" y="22">▶|</text></g>
    <g><rect class="button" x="350" y="0" width="92" height="31" rx="4"/><text class="ui small" x="363" y="21">＋ 添加部件</text></g>
