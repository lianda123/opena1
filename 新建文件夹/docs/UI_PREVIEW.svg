  <text x="55" y="520" class="ui small muted">轨道：拨盘旋转　帧：60　关键帧：3　停止播放后用 Gumball 摆姿态，再插入关键帧。</text>
  <text x="55" y="548" class="ui small" fill="#ffb13a">连续转动示例：0 帧 = 0°，60 帧 = 360°，120 帧 = 720°</text>
